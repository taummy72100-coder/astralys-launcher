plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.6.3'
group = 'fr.astralys'
base { archivesName = 'astralys-carte-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // Jeu de test (captures automatiques des ecrans en CI : ASTRALYS_CAPTURES=1)
    runs {
        client {
            workingDirectory project.file('run')
            args '--width', '1600', '--height', '900'
            mods { astralyscarte { source sourceSets.main } }
        }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.named('jar') {
    manifest.attributes(['Specification-Title': 'astralyscarte', 'Implementation-Version': version])
    finalizedBy 'reobfJar'
}
