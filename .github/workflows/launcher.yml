name: Launcher Windows

# Construit l'installateur Windows du launcher et le met en telechargement dans "Releases".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'build/**', 'index.js', 'package.json', 'package-lock.json', 'electron-builder.yml', '.github/workflows/launcher.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Installer les dependances
        run: npm ci

      - name: Construire l'installateur
        run: npx electron-builder --win --publish never

      - name: Lire la version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Astralys Launcher ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
