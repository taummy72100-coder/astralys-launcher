name: Captures des ecrans
# Lance le jeu (sans compte, ecran virtuel) et capture chaque ecran du mod avec des donnees d'exemple.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8' }
      - name: Ecran virtuel
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - name: Lancer le jeu et capturer
        env: { ASTRALYS_CAPTURES: '1' }
        run: |
          mkdir -p mod/run && printf 'guiScale:3\nresourcePacks:["mod_resources","vanilla"]\n' > mod/run/options.txt
          timeout 1500 xvfb-run -s "-screen 0 1920x1080x24" gradle -p mod runClient --no-daemon > jeu.log 2>&1 || true
          tail -40 jeu.log
          ls -la mod/run/screenshots || true
      - name: Publier les captures sur la branche captures
        run: |
          mkdir /tmp/c && cp mod/run/screenshots/*.png /tmp/c/ && cd /tmp/c
          git init -q -b captures && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Captures ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" captures
